let AC = null;
function sfx(f, d = 0.1, type = 'square', v = 0.08, f2 = null) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(t + d);
  } catch (e) {}
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();

}
function text(s, x, y, size = 16, color = '#fff', align = 'left', stroke = null) {

}

}

// Тайлы: 0 пусто, 1 стена, 2 платформа (сквозная снизу), 3 опасность
function build(def) {
  const W = def.w, g = [];
  for (let y = 0; y < ROWS; y++) g.push(new Array(W).fill(0));
  const L = { ents: [], items: [], movers: [], lasers: [], checks: [], start: { x: 2 * T, y: 15 * T }, exit: null };
  const set = (x, y, v) => { if (x >= 0 && x < W && y >= 0 && y < ROWS) g[y][x] = v; };
  const api = {
    ground(a, b, top = 15) { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, 1); },
    block(x, y, w, h) { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) set(x + i, y + j, 1); },
    plat(x, y, w) { for (let i = 0; i < w; i++) set(x + i, y, 2); },
    haz(x, y, w) { for (let i = 0; i < w; i++) set(x + i, y, 3); },
    coins(x, y, n, s = 1) { for (let i = 0; i < n; i++) L.items.push({ t: 'coin', x: (x + i * s) * T + T / 2, y: y * T + T / 2 }); },
    item(t, x, y) { L.items.push({ t, x: x * T + T / 2, y: y * T + T / 2 }); },
    e(t, x, y) { L.ents.push({ t, x: x * T, y: y * T }); },
    ally(t, x, y, lines) { L.ents.push({ t, x: x * T, y: y * T, lines }); },
    mover(x, y, w, range, sp = 1.2) { L.movers.push({ x: x * T, y: y * T, w: w * T, h: 12, x0: x * T, x1: (x + range) * T, sp, dir: 1, dx: 0 }); },
    laser(x, ph = 0) { L.lasers.push({ x: x * T + T / 2, ph }); },
    check(x, y) { L.checks.push({ x: x * T + 8, y: y * T - 56, w: 20, h: 56, on: false }); },
    exit(x, y) { L.exit = { x: x * T, y: y * T - 72, w: 56, h: 72 }; },
    start(x, y) { L.start = { x: x * T, y: y * T }; },
  };
  def.build(api);
  L.grid = g; L.w = W; L.def = def;
  for (const l of L.lasers) {
    const tx = Math.floor(l.x / T);
    let r = 0;
    while (r < ROWS && g[r][tx] === 1) r++;
    l.top = r * T;
    while (r < ROWS && g[r][tx] !== 1) r++;
    l.bottom = r * T;
  }
  return L;
}

function tileAt(tx, ty) {
  if (tx < 0 || tx >= level.w) return 1;
  if (ty < 0 || ty >= ROWS) return 0;
  return level.grid[ty][tx];
}

function move(e, dx, dy, oneway) {
  e.hitWall = false;
  e.x += dx;
  const top = Math.floor(e.y / T), bot = Math.floor((e.y + e.h - 1) / T);
  if (dx > 0) {
    const tx = Math.floor((e.x + e.w - 1) / T);
    for (let ty = top; ty <= bot; ty++) if (tileAt(tx, ty) === 1) { e.x = tx * T - e.w; e.vx = 0; e.hitWall = true; e.wallDir = 1; break; }
  } else if (dx < 0) {
    const tx = Math.floor(e.x / T);
    for (let ty = top; ty <= bot; ty++) if (tileAt(tx, ty) === 1) { e.x = (tx + 1) * T; e.vx = 0; e.hitWall = true; e.wallDir = -1; break; }
  }
  e.onGround = false;
  const prevBottom = e.y + e.h;
  e.y += dy;
  const l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 1) / T);
  if (dy > 0) {
    const ty = Math.floor((e.y + e.h - 1) / T);
    for (let tx = l; tx <= r; tx++) {
      const t = tileAt(tx, ty);
      if (t === 1 || (t === 2 && oneway && prevBottom <= ty * T + 0.5)) { e.y = ty * T - e.h; e.vy = 0; e.onGround = true; break; }
    }
  } else if (dy < 0) {
    const ty = Math.floor(e.y / T);
    for (let tx = l; tx <= r; tx++) if (tileAt(tx, ty) === 1) { e.y = (ty + 1) * T; e.vy = 0; break; }
  }
}

function loadLevel(i) {
  level = build(LEVELS[i]);
  player = newPlayer(level.start.x, level.start.y);
  ents = level.ents.map(s => s.t === 'boss' ? spawnBoss(s) : spawnEnemy(s));
  boss = ents.find(e => e.t === 'boss') || null;
  projs = []; parts = []; texts = [];
  hasPass = false; cam = 0; levelTime = 0; msgT = 0;
  respawn = { x: level.start.x, y: level.start.y };
  levelStartScore = score; levelStartMoney = money; ilyaFlash = 0;
}

function burst(x, y, c, n = 10, sp = 3) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-sp, sp), vy: rnd(-sp * 1.3, sp * 0.5), life: rnd(20, 40), c, s: rnd(2, 5) });
}
function floatText(x, y, s, c = '#fff') { texts.push({ x, y, s, c, life: 60 }); }
function say(e, s, t = 120) { e.say = s; e.sayT = t; }
function showMsg(s, t = 120) { msg = s; msgT = t; }

function hurtPlayer(dir) {
  const p = player;
  if (god || p.inv > 0 || state !== 'play') return false;
  p.hp--; p.inv = 90; p.vx = dir * 5; p.vy = -6; p.hurtT = 12;
  S.hit(); shake = 10;
  burst(p.x + p.w / 2, p.y + p.h / 2, '#ff6b6b', 12);
  if (p.hp <= 0) { state = 'over'; cardT = 0; }
  return true;
}
function searchPlayer(e) {
  const p = player;
  if (god || p.inv > 0 || e.cool > 0 || state !== 'play') return;
  const lost = money;
  money = 0;
  p.inv = 120; p.vx = 0; p.vy = 0;
  p.frozen = 60; p.frozenMsg = 'Обыск! Все деньги изъяты';
  e.stop = 70; e.cool = 200;
  say(e, lost ? 'Это я конфискую.' : 'Пустой? Ну иди.', 90);
  floatText(p.x + p.w / 2, p.y - 30, lost ? `−${lost} ₽` : '0 ₽', '#ff8787');
  S.hit(); shake = 6;
}
function stopPlayer(msgText) {
  const p = player;
  if (god || p.talkImm > 0 || p.inv > 0) return;
  p.frozen = 30; p.frozenMsg = msgText; p.talkImm = 90; p.vx = 0; S.talk();
}
function callIlya() {
  if (!perks.ilya || state !== 'play') return;
  perks.ilya = false; perks.ilyaUsed = true;
  for (const e of ents) {
    if (e.npc || e.dead || e.t === 'boss') continue;
    if (Math.abs(e.x - (cam + VW / 2)) < VW * 0.75) hurtEnemy(e, 999);
  }
  projs = projs.filter(q => q.friendly);
  if (boss && boss.state !== 'intro' && boss.state !== 'defeat') hurtEnemy(boss, 12);
  player.hp = player.max;
  if (!level.def.boss && !hasPass) hasPass = true;
  ilyaFlash = 120; shake = 12;
  showMsg('Илья К. решил все проблемы!', 160); S.win();
}
function hurtEnemy(e, n) {
  if (e.npc) return;
  if (e.t === 'boss') {
    if (e.state === 'intro' || e.state === 'defeat') return;
    e.hp -= n; e.flash = 8; S.ehit();
    burst(e.x + e.w / 2, e.y + 30, '#ffd166', 6);
    if (e.hp <= 0) bossDefeat(e);
    return;
  }
  e.hp -= n; e.flash = 8; S.ehit();
  if (e.hp <= 0) {
    e.dead = true;
    score += e.score;
    floatText(e.x + e.w / 2, e.y, '+' + e.score, '#ffd166');
    burst(e.x + e.w / 2, e.y + e.h / 2, '#ffffff', 14);
    if (e.t === 'kopytova') {
      level.items.push({ t: 'pass', x: e.x + e.w / 2, y: e.y + e.h - 20 });
      floatText(e.x + e.w / 2, e.y - 24, 'Директор К.: «Ну... пока!»', '#fff');
      showMsg('Директор К. уронила ПРОПУСК!', 150);
      S.boss(); shake = 12;
    } else if (player.hp < player.max && Math.random() < 0.2) level.items.push({ t: 'heal', x: e.x + e.w / 2, y: e.y + e.h - 16 });
  }
}

const PK = {
  plane: { w: 18, h: 8 }, chalk: { w: 12, h: 5 }, nut: { w: 10, h: 10 }, hello: { w: 50, h: 18 }, spit: { w: 10, h: 8 },
  deadline: { w: 24, h: 16 }, kpi: { w: 12, h: 12 }, wave: { w: 24, h: 22 }, talk: { w: 26, h: 18 },
};
function shootE(e, kind, vx, vy, g, extra = {}) {
  const d = PK[kind];
  projs.push(Object.assign({ kind, x: e.x + e.w / 2 - d.w / 2, y: e.y + 14, w: d.w, h: d.h, vx, vy, g, life: 240, friendly: false, rot: 0 }, extra));
}
function arcE(e, kind, tgt, t) {
  const sx = e.x + e.w / 2, sy = e.y + 14, g = 0.3;
  const tx = tgt.x + tgt.w / 2, ty = tgt.y + tgt.h / 2;
  const vx = clamp((tx - sx) / t, -7, 7), vy = clamp((ty - sy - 0.5 * g * t * t) / t, -12, 4);
  shootE(e, kind, vx, vy, g);
}

// ---------- обновление ----------
function updatePlayer() {
  const p = player, d = level.def, G = 0.55 * (d.grav || 1);
  for (const m of level.movers) { m.dx = m.sp * m.dir; m.x += m.dx; if (m.x > m.x1 || m.x < m.x0) m.dir *= -1; }
  let dir = (K.right() ? 1 : 0) - (K.left() ? 1 : 0);
  if (p.hurtT > 0) { p.hurtT--; dir = 0; }
  if (p.lock > 0) { p.lock--; dir = 0; }
  if (p.talkImm > 0) p.talkImm--;
  const frozen = p.frozen > 0;
  if (frozen) { p.frozen--; dir = 0; p.vx *= 0.8; }
  const maxSp = god ? 7.5 : 4.2;
  if (K.call()) callIlya();
  const ax = god ? 1.2 : p.onGround ? 0.7 : 0.45;
  if (dir) { p.vx += dir * ax; p.f = dir; }
  else if (!p.lock) { p.vx *= p.onGround ? 0.72 : 0.93; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  p.vx = clamp(p.vx, -maxSp, maxSp);
  p.coyote = p.onGround ? 7 : p.coyote - 1;
  p.buf = K.jumpP() && !frozen ? 7 : p.buf - 1;
  if (p.wallT > 0) p.wallT--;
  if (p.buf > 0 && p.coyote > 0) {
    const under = tileAt(Math.floor((p.x + p.w / 2) / T), Math.floor((p.y + p.h + 1) / T));
    if (K.down() && under === 2) p.drop = 12;
    else { p.vy = -11.6 * (d.jump || 1); S.jump(); }
    p.buf = 0; p.coyote = 0;
  } else if (p.buf > 0 && p.wallT > 0 && !p.onGround) {
    // отскок от стены
    p.vy = -10.8; p.vx = -p.wallSide * 5; p.f = -p.wallSide; p.lock = 9;
    p.buf = 0; p.wallT = 0; S.jump();
    burst(p.x + (p.wallSide > 0 ? p.w : 0), p.y + p.h / 2, '#dee2e6', 5, 1.5);
  }
  if (god) {
    // полёт: вверх/вниз без гравитации
    const vdir = (K.down() ? 1 : 0) - (K.jump() ? 1 : 0);
    p.vy += (vdir * 7 - p.vy) * 0.25;
    p.buf = 0; p.wallT = 0;
  } else {
    if (!K.jump() && p.vy < -3) p.vy += G * 1.3;
    p.vy = Math.min(p.vy + G, 12);
  }
  if (p.wallT > 0 && dir === p.wallSide && p.vy > 2) p.vy = 2;
  if (p.drop > 0) p.drop--;
  const carry = p.mover ? p.mover.dx : 0;
  const prevBottom = p.y + p.h;
  move(p, p.vx + carry, p.vy, p.drop <= 0 && !(god && K.down()));
  if (god) p.y = Math.max(p.y, 0);
  if (!p.onGround && p.hitWall && dir === p.wallDir) { p.wallT = 7; p.wallSide = p.wallDir; }
  p.mover = null;
  if (p.vy >= 0) for (const m of level.movers) {
    if (prevBottom <= m.y + 2 && p.y + p.h >= m.y && p.x + p.w > m.x && p.x < m.x + m.w) {
      p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.mover = m;
    }
  }
  p.anim += p.onGround ? Math.abs(p.vx) * 0.18 : 0;
  if (p.inv > 0) p.inv--;
  p.cd--;
  p.laser = null;
  if (god && K.fire()) fireLaser(p);
  else if (K.fire() && p.cd <= 0 && !frozen) {
    p.cd = 16; S.shoot();
    projs.push({ kind: 'plane', x: p.x + p.w / 2 + p.f * 8 - 9, y: p.y + 14, w: 18, h: 8, vx: p.f * 9, vy: 0, g: 0, life: 70, friendly: true });
  }
  // опасные тайлы
  const hx0 = Math.floor((p.x + 4) / T), hx1 = Math.floor((p.x + p.w - 4) / T);
  const hy0 = Math.floor((p.y + 8) / T), hy1 = Math.floor((p.y + p.h - 1) / T);
  for (let ty = hy0; ty <= hy1; ty++) for (let tx = hx0; tx <= hx1; tx++) {
    if (tileAt(tx, ty) === 3 && p.y + p.h > ty * T + 12 && p.inv <= 0 && !god) { hurtPlayer(-p.f); p.vy = -10; }
  }
  for (const l of level.lasers) {
    const c = (tick + l.ph) % 160;
    if (c >= 110 && Math.abs(p.x + p.w / 2 - l.x) < 14 && p.y < l.bottom && p.y + p.h > l.top) hurtPlayer(p.x + p.w / 2 < l.x ? -1 : 1);
  }
  // падение
  if (god && p.y > ROWS * T - p.h) { p.y = ROWS * T - p.h; p.vy = Math.min(p.vy, 0); }
  if (p.y > ROWS * T + 40 && state === 'play') {
    p.hp--; S.hit(); shake = 10;
    if (p.hp <= 0) { state = 'over'; cardT = 0; return; }
    p.x = respawn.x + 5; p.y = respawn.y - p.h; p.vx = p.vy = 0; p.inv = 90;
    showMsg('Ай! Вернись на контрольную точку', 90);
  }
  for (const c of level.checks) if (!c.on && overlap(p, c)) {
    c.on = true; respawn = { x: c.x - 8, y: c.y + c.h }; S.pick(); showMsg('Контрольная точка!', 80);
  }
  for (const it of level.items) {
    if (it.got) continue;
    if (Math.abs(p.x + p.w / 2 - it.x) < 20 && Math.abs(p.y + p.h / 2 - it.y) < 30) {
      it.got = true;
      if (it.t === 'coin') { money += 10; S.coin(); burst(it.x, it.y, '#ffd166', 5, 2); }
      else if (it.t === 'heal') { p.hp = Math.min(p.max, p.hp + 1); S.pick(); floatText(it.x, it.y, '+1 ♥', '#ff8fa3'); }
      else if (it.t === 'pass') { hasPass = true; S.pick(); showMsg('Пропуск у тебя! Беги к выходу →', 140); score += 100; }
    }
  }
  if (level.exit && overlap(p, level.exit)) {
    if (hasPass) {
      const secs = Math.floor(levelTime / 60);
      lastBonus = Math.max(0, (150 - secs) * 10);
      score += lastBonus;
      state = 'clear'; cardT = 0; S.win();
    } else if (msgT <= 0) { S.deny(); showMsg('Турникет закрыт. Нужен ПРОПУСК!', 100); }
  }
}

function fireLaser(p) {
  const ey = p.y + 8, ex = p.x + p.w / 2 + p.f * 4;
  let len = 0;
  while (len < 900) {
    const tx = Math.floor((ex + p.f * len) / T), ty = Math.floor(ey / T);
    if (tileAt(tx, ty) === 1) break;
    len += 8;
  }
  const x0 = p.f > 0 ? ex : ex - len, beam = { x: x0, y: ey - 4, w: len, h: 8 };
  p.laser = { x0: ex, x1: ex + p.f * len, y: ey };
  for (const q of projs) if (!q.friendly && overlap(q, beam)) q.life = 0;
  if (tick % 5 === 0) {
    for (const e of ents) if (!e.dead && !e.npc && overlap(e, beam)) hurtEnemy(e, 1);
    burst(ex + p.f * len, ey, '#ff6b6b', 3, 2);
  }
  if (tick % 8 === 0) sfx(1200, 0.06, 'sawtooth', 0.025, 900);
}
function groundAhead(e) {
  const fx = e.f > 0 ? e.x + e.w + 2 : e.x - 2;
  const tb = tileAt(Math.floor(fx / T), Math.floor((e.y + e.h + 4) / T));
  return tb === 1 || tb === 2;
}

function updEnemy(e) {
  if (e.flash > 0) e.flash--;
  if (e.sayT > 0) e.sayT--;
  if (e.cool > 0) e.cool--;
  const p = player;
  if (Math.abs(e.x - (cam + VW / 2)) > VW) return;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2);
  if (e.fly) {
    e.ph += 0.06;
    const chase = Math.hypot(dx, dy) < 380;
    e.vx += ((chase ? Math.sign(dx) * e.sp : Math.sin(e.ph * 0.4) * 0.6) - e.vx) * 0.04;
    const ty = chase ? p.y - 6 : e.homeY;
    e.vy = (e.vy + (ty - e.y) * 0.0025) * 0.96;
    e.x += e.vx; e.y += e.vy + Math.sin(e.ph) * 0.5;
    e.f = e.vx >= 0 ? 1 : -1;
    return;
  }
  let speed = e.sp, chasing = false;
  const sameFloor = Math.abs(dy) < 70;
  if (e.t === 'guard' && Math.abs(dx) < 270 && sameFloor) { speed = 2.7; chasing = true; }
  if (e.t === 'toiletguard' && e.cool <= 0 && Math.abs(dx) < 230 && sameFloor) { speed = 2.3; chasing = true; }
  if (e.t === 'robodog' && Math.abs(dx) < 300 && Math.abs(dy) < 90) { speed = 3.4; chasing = true; }
  if (e.t === 'socped' && Math.abs(dx) < 320 && sameFloor && Math.abs(dx) > 60) { speed = 0.6; chasing = true; }
  if (chasing) e.f = Math.sign(dx) || e.f;
  e.alert = chasing && e.t !== 'socped';
  e.vx = e.f * speed;
  if (e.stop > 0) { e.stop--; e.vx = 0; }
  if (e.onGround && !groundAhead(e)) {
    if (chasing && e.t === 'robodog') e.vy = -9;
    else if (chasing) e.vx = 0;
    else { e.f *= -1; e.vx = 0; }
  }
  e.vy = Math.min(e.vy + 0.55, 12);
  move(e, e.vx, e.vy, true);
  if (e.hitWall) { if (chasing && e.t === 'robodog' && e.onGround) e.vy = -9; else if (!chasing) e.f *= -1; }
  if (e.y > ROWS * T + 100) e.dead = true;
  e.anim += Math.abs(e.vx) * 0.18;
  e.cd--;
  if (e.cd <= 0 && Math.abs(dx) < 380 && Math.abs(dy) < 220) {
    switch (e.t) {
      case 'teacher':
        if (Math.abs(dy) < 60) { e.f = Math.sign(dx) || e.f; shootE(e, 'chalk', e.f * 5, 0, 0); e.stop = 20; e.cd = 110; }
        break;
      case 'lab': e.f = Math.sign(dx) || e.f; arcE(e, 'nut', p, 45); e.stop = 25; e.cd = 120; break;
      case 'socped':
        e.f = Math.sign(dx) || e.f;
        shootE(e, 'talk', e.f * 2, -0.5, 0, { home: true, life: 260 });
        say(e, pick(['Давай поговорим?', 'Как ты себя чувствуешь?', 'Зайди ко мне после урока!']), 90);
        e.stop = 30; e.cd = 170;
        break;
    }
  }
}

function nearestFoe(e, range) {
  let best = null, bd = range;
  for (const o of ents) {
    if (o.npc || o.dead || (o.t === 'boss' && o.state === 'defeat')) continue;
    const d = Math.hypot(o.x + o.w / 2 - (e.x + e.w / 2), o.y + o.h / 2 - (e.y + e.h / 2));
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}
function updNPC(e) {
  const p = player, dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2);
  if (e.sayT > 0) e.sayT--;
  e.vy = Math.min(e.vy + 0.55, 12);
  e.near = Math.abs(dx) < 170 && Math.abs(dy) < 120;
  if (e.near && ++e.lt > 140) { e.lt = 0; e.line = (e.line + 1) % e.lines.length; }
  if (!e.joined) {
    move(e, 0, e.vy, true);
    e.f = Math.sign(dx) || 1;
    if (Math.abs(dx) < 80 && Math.abs(dy) < 80) {
      if (e.follow) { e.joined = true; showMsg(`${e.name} теперь с тобой!`, 140); S.pick(); }
      if (e.t === 'ilya' && !e.gave) {
        e.gave = true;
        if (!perks.ilya && !perks.ilyaUsed) { perks.ilya = true; showMsg('Илья К. на связи! Нажми E — решит все проблемы (1 раз)', 200); S.pick(); }
      }
    }
    return;
  }
  // союзник идёт за игроком
  const tx = p.x - p.f * 44 - e.x;
  const vx = Math.abs(tx) > 14 ? clamp(tx * 0.08, -4.6, 4.6) : 0;
  if (vx) e.f = Math.sign(vx); else e.f = Math.sign(dx) || e.f;
  if (e.onGround && ((vx && (!groundAhead(e) || e.hitWall)) || (dy < -50 && Math.abs(dx) < 140))) e.vy = -11.4;
  move(e, vx, e.vy, true);
  e.anim += Math.abs(vx) * 0.18;
  if (Math.hypot(dx, dy) > 450 || e.y > ROWS * T) { e.x = p.x - p.f * 30; e.y = p.y + p.h - e.h; e.vy = 0; }
  e.cd--;
  if (e.follow === 'spit' && e.cd <= 0) {
    const foe = nearestFoe(e, 340);
    if (foe) {
      const ax = foe.x + foe.w / 2 - (e.x + e.w / 2), ay = foe.y + foe.h / 2 - (e.y + 14), d = Math.hypot(ax, ay) || 1;
      e.f = Math.sign(ax) || e.f;
      projs.push({ kind: 'spit', x: e.x + e.w / 2 - 5, y: e.y + 14, w: 10, h: 8, vx: ax / d * 7, vy: ay / d * 7, g: 0, life: 60, friendly: true });
      if (Math.random() < 0.3) say(e, 'Тьфу!', 40);
      sfx(700, 0.06, 'square', 0.03, 300);
      e.cd = 45;
    } else e.cd = 10;
  }
  if (e.follow === 'stink') {
    if (tick % 6 === 0) parts.push({ x: e.x + e.w / 2 + rnd(-30, 30), y: e.y + rnd(0, e.h), vx: rnd(-0.4, 0.4), vy: -rnd(0.3, 0.9), life: 40, c: 'rgba(130,201,30,.7)', s: rnd(3, 6), nog: true });
    if (e.cd <= 0) {
      e.cd = 40;
      for (const o of ents) {
        if (o.npc || o.dead) continue;
        if (Math.hypot(o.x + o.w / 2 - (e.x + e.w / 2), o.y + o.h / 2 - (e.y + e.h / 2)) < 95) {
          hurtEnemy(o, 1);
          floatText(o.x + o.w / 2, o.y - 6, pick(['Фу!', 'Фууу!', 'Чем пахнет?!']), '#a9e34b');
        }
      }
    }
  }
}

const KOP_LINES = ['Привет!', 'Приве-е-ет!', 'Привет, а ты куда?', 'Всем привет!'];
function sayHello(e) {
  const p = player, ax = p.x + p.w / 2 - (e.x + e.w / 2), ay = p.y + 16 - (e.y + 14), d = Math.hypot(ax, ay) || 1;
  shootE(e, 'hello', ax / d * 4.5, ay / d * 4.5 + rnd(-0.6, 0.6), 0);
  sfx(520, 0.15, 'sine', 0.06, 760);
}
function updKop(e) {
  if (e.flash > 0) e.flash--;
  if (e.sayT > 0) e.sayT--;
  const p = player, dx = (p.x + p.w / 2) - (e.x + e.w / 2);
  if (!e.active) {
    if (Math.abs(dx) < 460) {
      e.active = true; e.state = 'throw'; e.st = 60;
      say(e, 'Привет! Куда это мы?', 130);
      showMsg('Мини-босс: директор К.!', 120); S.boss(); shake = 8;
    }
  } else {
    e.st--;
    switch (e.state) {
      case 'walk':
        e.f = Math.sign(dx) || e.f; e.vx = e.f * 1.4;
        if (!groundAhead(e)) e.vx = 0;
        if (e.st <= 0) kopNext(e);
        break;
      case 'throw':
        e.vx = 0; e.f = Math.sign(dx) || e.f;
        if (e.st === 40 || e.st === 26 || e.st === 12) sayHello(e);
        if (e.st <= 0) kopNext(e);
        break;
      case 'charge':
        if (e.st > 50) e.vx = 0;
        else e.vx = e.f * 6.5;
        if (e.st <= 50 && (!groundAhead(e) || e.hitWall)) { e.vx = 0; e.st = 0; shake = 6; }
        if (e.st <= 0) kopNext(e);
        break;
    }
  }
  e.vy = Math.min(e.vy + 0.55, 12);
  move(e, e.active ? e.vx : 0, e.vy, true);
  e.anim += Math.abs(e.vx) * 0.15;
}
function kopNext(e) {
  const opts = ['walk', 'throw', 'charge'].filter(s => s !== e.state);
  e.state = pick(opts);
  if (e.state === 'walk') e.st = 70;
  if (e.state === 'throw') { e.st = 50; say(e, pick(KOP_LINES), 80); }
  if (e.state === 'charge') { e.st = 95; e.f = Math.sign(player.x - e.x) || e.f; say(e, 'ПРИВЕЕЕЕТ!', 70); }
}

const BOSS_LINES = ['Держи дедлайн!', 'А где рефлексия?', 'Это командная задача!', 'Complex Learning!', 'Сначала — защита проекта!', 'Опоздание — тоже кейс!'];
function bossNext(b) {
  const p = player, dx = (p.x + p.w / 2) - (b.x + b.w / 2);
  const opts = ['walk', 'throw'];
  if (b.phase >= 2) opts.push('jump', 'jump');
  if (b.phase >= 3) opts.push('barrage', 'summon');
  let s;
  do s = pick(opts); while (s === b.last && s !== 'walk');
  b.last = s; b.state = s;
  switch (s) {
    case 'walk': b.st = 80; break;
    case 'throw': b.st = 25 * (b.phase + 1) + 10; if (Math.random() < 0.5) say(b, pick(BOSS_LINES), 80); break;
    case 'jump': b.vy = -12.5; b.vx = clamp(dx / 55, -6, 6); b.air = false; b.st = 999; break;
    case 'barrage': b.st = 70; say(b, 'KPI-шквал!', 70); break;
    case 'summon': b.st = 60; say(b, 'Робопсы, ко мне!', 80); break;
  }
}
function bossDefeat(b) {
  b.hp = 0; b.state = 'defeat'; b.st = 220; b.vx = 0;
  say(b, 'Ладно... Проект защищён. Свободен!', 220);
  S.boss(); shake = 25;
  projs = projs.filter(q => q.friendly);
  for (const e of ents) if (e !== b && !e.npc) e.dead = true;
  burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd166', 40, 5);
}
function updBoss(b) {
  const p = player;
  if (b.flash > 0) b.flash--;
  if (b.sayT > 0) b.sayT--;
  const dx = (p.x + p.w / 2) - (b.x + b.w / 2);
  const ph = b.hp > 27 ? 1 : b.hp > 13 ? 2 : 3;
  if (ph > b.phase && b.state !== 'defeat') {
    b.phase = ph; b.state = 'roar'; b.st = 70; b.vx = 0;
    say(b, ph === 2 ? 'Неплохо! Но это ещё не весь кейс!' : 'Финальная защита! Время пошло!', 120);
    S.boss(); shake = 15;
    level.items.push({ t: 'heal', x: 15 * T, y: 7 * T + 8 });
  }
  b.st--;
  switch (b.state) {
    case 'intro':
      b.vx = 0;
      if (b.st === 150) say(b, 'Куда собрался? Урок ещё не закончен!', 150);
      if (b.st <= 0) bossNext(b);
      break;
    case 'walk':
      b.f = Math.sign(dx) || b.f;
      b.vx = b.f * (0.8 + b.phase * 0.5);
      if (b.st <= 0) bossNext(b);
      break;
    case 'throw':
      b.vx = 0; b.f = Math.sign(dx) || b.f;
      if (b.st > 0 && b.st % 25 === 0) { arcE(b, 'deadline', p, 40 + Math.random() * 15); S.shoot(); }
      if (b.st <= 0) bossNext(b);
      break;
    case 'jump':
      if (!b.onGround) b.air = true;
      if (b.air && b.onGround) {
        b.vx = 0; b.state = 'stun'; b.st = 45; shake = 14; S.boss();
        const gy = b.y + b.h - 22;
        for (const s of [-1, 1]) projs.push({ kind: 'wave', x: b.x + b.w / 2 - 12, y: gy, w: 24, h: 22, vx: s * (4 + b.phase), vy: 0, g: 0, life: 200, friendly: false });
        burst(b.x + b.w / 2, b.y + b.h, '#c9ccd3', 16, 4);
      }
      break;
    case 'barrage':
      b.vx = 0;
      if (b.st === 35) {
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2;
          projs.push({ kind: 'kpi', x: b.x + b.w / 2 - 6, y: b.y + 30, w: 12, h: 12, vx: Math.cos(a) * 3.6, vy: Math.sin(a) * 3.6, g: 0, life: 200, friendly: false });
        }
        S.shoot();
      }
      if (b.st <= 0) bossNext(b);
      break;
    case 'summon':
      b.vx = 0;
      if (b.st === 30 && ents.filter(e => e.t === 'robodog').length < 2) {
        for (const s of [-1, 1]) {
          const d = spawnEnemy({ t: 'robodog', x: clamp(b.x + s * 80, 2 * T, 27 * T), y: 15 * T });
          d.f = s; ents.push(d);
        }
      }
      if (b.st <= 0) bossNext(b);
      break;
    case 'stun': case 'roar':
      b.vx = 0;
      if (b.st <= 0) bossNext(b);
      break;
    case 'defeat':
      b.vx = 0;
      if (tick % 8 === 0) burst(b.x + rnd(0, b.w), b.y + rnd(0, b.h), pick(['#ffd166', '#ff6b6b', '#4dabf7']), 6, 3);
      if (b.st <= 0) { score += 1000; state = 'win'; cardT = 0; parts = []; S.win(); }
      break;
  }
  b.vy = Math.min(b.vy + 0.55, 14);
  move(b, b.vx, b.vy, false);
  b.anim += Math.abs(b.vx) * 0.12;
}

function updProjs() {
  const p = player;
  for (const q of projs) {
    if (q.home) {
      const tx = p.x + p.w / 2 - (q.x + q.w / 2), ty = p.y + 10 - (q.y + q.h / 2), d = Math.hypot(tx, ty) || 1;
      q.vx = clamp(q.vx + tx / d * 0.08, -2.2, 2.2); q.vy = clamp(q.vy + ty / d * 0.08, -2.2, 2.2);
    }
    q.vy += q.g; q.x += q.vx; q.y += q.vy; q.life--; q.rot = (q.rot || 0) + 0.2;
    const cx = q.x + q.w / 2, cy = q.y + q.h / 2;
    const t = tileAt(Math.floor(cx / T), Math.floor(cy / T));
    if (q.kind === 'wave') {
      if (tileAt(Math.floor((q.vx > 0 ? q.x + q.w : q.x) / T), Math.floor(cy / T)) === 1) q.life = 0;
    } else if (!q.home && (t === 1 || (t === 2 && q.g > 0 && q.vy > 0 && (cy % T) < 10))) {
      q.life = 0; burst(cx, cy, '#ddd', 4, 1.5);
    }
    if (q.life <= 0) continue;
    if (q.friendly) {
      for (const e of ents) if (!e.dead && !e.npc && overlap(q, e)) { hurtEnemy(e, 1); q.life = 0; break; }
      if (q.life > 0) for (const o of projs) if (o.kind === 'talk' && o.life > 0 && overlap(q, o)) { o.life = 0; q.life = 0; burst(o.x + 13, o.y + 9, '#fff', 6, 2); }
    } else if (overlap(q, p)) {
      if (q.kind === 'talk') {
        stopPlayer('Давай обсудим твои чувства...');
        q.life = 0;
      } else {
        hurtPlayer(q.vx > 0 ? 1 : -1);
        if (q.kind !== 'wave') q.life = 0;
      }
    }
  }
  projs = projs.filter(q => q.life > 0 && q.y < ROWS * T + 50);
}

function update() {
  tick++; levelTime++;
  if (msgT > 0) msgT--;
  if (shake > 0) shake--;
  updatePlayer();
  if (state !== 'play') return;
  for (const e of ents) {
    if (e.dead) continue;
    if (e.npc) { updNPC(e); continue; }
    if (e.t === 'boss') updBoss(e);
    else if (e.t === 'kopytova') updKop(e);
    else updEnemy(e);
    if (state !== 'play') return;
    if (e.dead || (e.t === 'boss' && e.state === 'defeat')) continue;
    if (overlap(player, e)) {
      const p = player, big = e.t === 'boss' || e.t === 'kopytova';
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 10) {
        hurtEnemy(e, big ? 1 : 2);
        p.vy = big ? -11 : -8.5; S.stomp();
        if (big) p.vx = (p.x < e.x + e.w / 2 ? -1 : 1) * 4;
      } else if (e.t === 'toiletguard') searchPlayer(e);
      else if (e.t === 'socped') stopPlayer('Стоять! Поговорим?');
      else hurtPlayer(p.x + p.w / 2 < e.x + e.w / 2 ? -1 : 1);
    }
  }
  ents = ents.filter(e => !e.dead);
  updProjs();
  for (const q of parts) { q.x += q.vx; q.y += q.vy; if (!q.nog) q.vy += 0.15; q.life--; }
  parts = parts.filter(q => q.life > 0);
  if (ilyaFlash > 0) ilyaFlash--;
  for (const t of texts) { t.y -= 0.6; t.life--; }
  texts = texts.filter(t => t.life > 0);
  const target = player.x - VW / 2 + player.f * 60;
  cam += (target - cam) * 0.1;
  cam = clamp(cam, 0, level.w * T - VW);
}

function newGame() {
  score = 0; money = 0; levelIdx = 0; perks.ilya = false; perks.ilyaUsed = false;
  loadLevel(0); state = 'card'; cardT = 0;
}
function step() {
  if (pressed.Digit4 || pressed.Numpad4) {
    god = !god;
    showMsg(god ? 'СУПЕРГЕРОЙ: бессмертие, полёт (↑↓), скорость, лазер из глаз (J)' : 'Супергерой выключен', 160);
    S.pick();
  }
  if (state === 'title') {
    tick++;
    if (K.start()) { newGame(); sfx(1, 0.01); }
  } else if (state === 'card') {
    cardT++;
    if (cardT > 20 && K.start()) state = 'play';
  } else if (state === 'play') {
    if (K.pause()) state = 'pause'; else update();
  } else if (state === 'pause') {
    if (K.pause() || pressed.Enter) state = 'play';
  } else if (state === 'clear') {
    cardT++;
    if (cardT > 40 && K.start()) { levelIdx++; loadLevel(levelIdx); state = 'card'; cardT = 0; }
  } else if (state === 'over') {
    cardT++;
    if (cardT > 40 && K.start()) { score = levelStartScore; money = levelStartMoney; loadLevel(levelIdx); state = 'card'; cardT = 0; }
  } else if (state === 'win') {
    cardT++; tick++;
    if (cardT % 5 === 0) parts.push({ x: rnd(0, VW), y: -10, vx: rnd(-1, 1), vy: rnd(1, 3), life: 220, c: pick(['#ffd166', '#ff6b6b', '#4dabf7', '#69db7c']), s: rnd(3, 6) });
    for (const q of parts) { q.x += q.vx; q.y += q.vy; q.life--; }
    parts = parts.filter(q => q.life > 0);
    if (cardT > 90 && K.start()) { state = 'title'; parts = []; }
  }
  for (const k in pressed) delete pressed[k];
  for (const k in tp) delete tp[k];
}

    if (p.laser) {
      const x1 = p.laser.x1 - cam, xa = Math.min(ex, x1), w = Math.abs(x1 - ex), jit = Math.sin(tick * 0.8) * 1.5;
      ctx.fillStyle = 'rgba(255,40,60,.35)'; ctx.fillRect(xa, ey - 7 + jit, w, 14);
      ctx.fillStyle = '#ff2b45'; ctx.fillRect(xa, ey - 3, w, 6);
      ctx.fillStyle = '#fff'; ctx.fillRect(xa, ey - 1, w, 2);
    }
  }
  if (p.wallT > 0 && !p.onGround) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(p.x - cam + (p.wallSide > 0 ? p.w : -2), p.y + 6, 2, p.h - 12); }
}

function drawProj(q) {
  const x = q.x - cam, y = q.y;
  switch (q.kind) {
    case 'plane':
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      if (q.vx > 0) { ctx.moveTo(x, y); ctx.lineTo(x + 18, y + 4); ctx.lineTo(x, y + 8); ctx.lineTo(x + 4, y + 4); }
      else { ctx.moveTo(x + 18, y); ctx.lineTo(x, y + 4); ctx.lineTo(x + 18, y + 8); ctx.lineTo(x + 14, y + 4); }
      ctx.fill(); ctx.strokeStyle = '#868e96'; ctx.lineWidth = 1; ctx.stroke();
      break;
    case 'chalk': ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 12, 5); ctx.fillStyle = '#bbb'; ctx.fillRect(x, y, 3, 5); break;
    case 'nut':
      ctx.save(); ctx.translate(x + 5, y + 5); ctx.rotate(q.rot);
      ctx.fillStyle = '#868e96'; ctx.fillRect(-5, -5, 10, 10); ctx.fillStyle = '#343a40'; ctx.fillRect(-2, -2, 4, 4);
      ctx.restore();
      break;
    case 'hello':
      ctx.fillStyle = '#fff3bf'; rr(x, y, 50, 18, 8);
      ctx.strokeStyle = '#e03131'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, 48, 16);
      text('Привет!', x + 25, y + 9, 11, '#c92a2a', 'center');
      break;
    case 'spit':
      ctx.fillStyle = 'rgba(200,240,255,.9)'; ctx.beginPath(); ctx.ellipse(x + 5, y + 4, 5, 4, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x + 2, y + 2, 2, 2);
      break;
    case 'deadline':
      ctx.save(); ctx.translate(x + 12, y + 8); ctx.rotate(Math.sin(q.rot) * 0.4);
      ctx.fillStyle = '#fff3bf'; ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = '#e03131'; ctx.fillRect(-12, -8, 24, 4);
      ctx.fillStyle = '#495057'; ctx.fillRect(-8, 0, 16, 2); ctx.fillRect(-8, 4, 12, 2);
      ctx.restore();
      break;
    case 'kpi':
      ctx.fillStyle = '#fd7e14'; ctx.beginPath(); ctx.arc(x + 6, y + 6, 6, 0, 7); ctx.fill();
      text('%', x + 6, y + 6, 9, '#fff', 'center');
      break;
    case 'wave':
      ctx.fillStyle = 'rgba(77,171,247,.8)';
      ctx.beginPath(); ctx.moveTo(x, y + 22); ctx.quadraticCurveTo(x + 12, y - 6, x + 24, y + 22); ctx.fill();
      break;
    case 'talk':
      ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(x, y, 26, 16, 7);
      ctx.beginPath(); ctx.moveTo(x + 6, y + 15); ctx.lineTo(x + 3, y + 21); ctx.lineTo(x + 12, y + 15); ctx.fill();
      ctx.fillStyle = '#f06595';
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 7 + i * 6, y + 8, 2, 0, 7); ctx.fill(); }
      break;
  }
}

function drawItem(it) {
  if (it.got) return;
  const x = it.x - cam, y = it.y + Math.sin(tick * 0.08 + it.x) * 3;
  if (x < -40 || x > VW + 40) return;
  if (it.t === 'coin') {
    ctx.fillStyle = '#f59f00'; ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill();
    text('₽', x, y + 1, 12, '#a0570d', 'center');
  } else if (it.t === 'heal') {
    ctx.fillStyle = '#e9b872'; ctx.beginPath(); ctx.ellipse(x, y, 13, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#c68642'; ctx.fillRect(x - 6, y - 3, 3, 2); ctx.fillRect(x + 2, y - 5, 3, 2); ctx.fillRect(x - 1, y + 1, 3, 2);
  } else if (it.t === 'pass') {
    ctx.fillStyle = 'rgba(255,212,59,.35)'; ctx.beginPath(); ctx.arc(x, y, 20 + Math.sin(tick * 0.1) * 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#1971c2'; rr(x - 14, y - 9, 28, 18, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 10, y - 5, 8, 10); ctx.fillRect(x + 1, y - 4, 9, 2); ctx.fillRect(x + 1, y, 7, 2);
  }
}

function drawWorldBits() {
  for (const c of level.checks) {
    const x = c.x - cam;
    ctx.fillStyle = '#495057'; ctx.fillRect(x + 8, c.y, 4, c.h);
    ctx.fillStyle = c.on ? '#40c057' : '#adb5bd';
    ctx.beginPath(); ctx.moveTo(x + 12, c.y); ctx.lineTo(x + 34, c.y + 9); ctx.lineTo(x + 12, c.y + 18); ctx.fill();
  }
  if (level.exit) {
    const e = level.exit, x = e.x - cam;
    ctx.fillStyle = '#1e252c'; ctx.fillRect(x, e.y, e.w, e.h);
    ctx.fillStyle = '#f2d16b'; ctx.fillRect(x + 6, e.y + 6, e.w - 12, e.h - 6);
    ctx.fillStyle = '#1e252c'; ctx.fillRect(x + e.w / 2 - 2, e.y + 6, 4, e.h - 6);
    ctx.fillStyle = '#2b8a3e'; rr(x - 4, e.y - 26, e.w + 8, 20, 4);
    text('ВЫХОД', x + e.w / 2, e.y - 16, 13, '#fff', 'center');
    ctx.fillStyle = '#ced4da'; ctx.fillRect(x - 26, e.y + 30, 22, 42);
    ctx.fillStyle = hasPass ? '#40c057' : '#fa5252'; ctx.fillRect(x - 21, e.y + 36, 12, 6);
    ctx.fillStyle = '#868e96'; ctx.fillRect(x - 6, e.y + 44, hasPass ? 4 : 30, 4);
  }
  for (const m of level.movers) {
    const x = m.x - cam;
    ctx.fillStyle = '#343a40'; ctx.fillRect(x, m.y, m.w, m.h);
    ctx.fillStyle = '#ffd43b'; ctx.fillRect(x, m.y, m.w, 4);
    text('ТЕЛЕЖКА', x + m.w / 2, m.y + 8, 8, '#adb5bd', 'center');
  }
  for (const l of level.lasers) {
    const x = l.x - cam, c = (tick + l.ph) % 160;
    if (x < -20 || x > VW + 20) continue;
    const top = l.top + 14;
    ctx.fillStyle = '#343a40'; ctx.fillRect(x - 10, l.top, 20, 14);
    ctx.fillStyle = '#495057'; ctx.fillRect(x - 3, l.top + 14, 6, 4);
    if (c >= 110) {
      ctx.fillStyle = 'rgba(255,40,60,.35)'; ctx.fillRect(x - 10, top, 20, l.bottom - top);
      ctx.fillStyle = '#ff2b45'; ctx.fillRect(x - 4, top, 8, l.bottom - top);
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, top, 2, l.bottom - top);
    } else if (c >= 80 && tick % 8 < 4) {
      ctx.fillStyle = 'rgba(255,40,60,.5)'; ctx.fillRect(x - 1, top, 2, l.bottom - top);
    }
  }
}

function heart(x, y, full) {
  ctx.fillStyle = full ? '#ff4d6d' : 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.arc(x - 5, y, 6, 0, 7); ctx.arc(x + 5, y, 6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 11, y + 2); ctx.lineTo(x, y + 14); ctx.lineTo(x + 11, y + 2); ctx.fill();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(8, 8, 470, 40, 8);
  for (let i = 0; i < player.max; i++) heart(26 + i * 26, 24, i < player.hp);
  text('Счёт: ' + score, 160, 28, 15, '#fff');
  text(money + ' ₽', 262, 28, 15, '#ffd43b');
  if (!level.def.boss) {
    ctx.fillStyle = hasPass ? '#1971c2' : 'rgba(255,255,255,.2)'; rr(330, 16, 34, 22, 3);
    text(hasPass ? '✓' : '?', 347, 28, 14, '#fff', 'center');
  }
  if (perks.ilya) { ctx.fillStyle = '#1c7ed6'; rr(374, 16, 96, 22, 4); text('☎ Илья [E]', 422, 28, 12, '#fff', 'center'); }
  text(`${levelIdx + 1}/${LEVELS.length} · ${level.def.name}`, VW - 16, 28, 15, '#fff', 'right', 'rgba(0,0,0,.6)');
  if (god) text('СУПЕРГЕРОЙ [4]', VW - 16, 52, 14, '#ffd43b', 'right', '#000');
  if (boss) {
    const w = 520, x = (VW - w) / 2, y = 70;
    text('АНДРЕЙ ИЛЬИЧ К. — владелец школы', VW / 2, y - 6, 15, '#fff', 'center', '#000');
    ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(x - 4, y + 6, w + 8, 20, 6);
    ctx.fillStyle = boss.phase === 3 ? '#e03131' : boss.phase === 2 ? '#f76707' : '#f59f00';
    rr(x, y + 10, w * Math.max(0, boss.hp) / boss.max, 12, 4);
  }
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT / 20);
    text(msg, VW / 2, VH - 40, 20, '#fff', 'center', '#000');
    ctx.globalAlpha = 1;
  }
}

function overlay(alpha = 0.7) { ctx.fillStyle = `rgba(8,12,24,${alpha})`; ctx.fillRect(0, 0, VW, VH); }

function drawTitle() {
  cam = 0;
  drawFacade();
  const bob = Math.sin(tick * 0.05) * 3;
  text('ПОБЕГ ИЗ СКОЛКИ', VW / 2, 50 + bob, 56, '#ffd43b', 'center', '#1b2438');
  ctx.fillStyle = 'rgba(10,14,24,.82)'; rr(90, 380, 780, 156, 12);
  text('Пятница, 15:59. Директор К., охрана туалетов, соцпеды и владелец школы', VW / 2, 400, 15, '#e9ecef', 'center');
  text('Андрей Ильич К. не отпускают. Помогут Влас, Ваня, Кирилл и Илья!', VW / 2, 420, 15, '#e9ecef', 'center');
  const ctl = [['← → / A D', 'бег'], ['↑ / W / Пробел', 'прыжок, у стены — отскок'], ['J / X', 'бумажный самолётик'],
    ['E / Q', 'позвать Илью (1 раз)'], ['прыжок сверху', 'оглушить врага'], ['P / Esc', 'пауза']];
  ctl.forEach(([k, v], i) => {
    const col = i % 2, row = Math.floor(i / 2), bx = col ? 640 : 280;
    text(k, bx - 10, 448 + row * 20, 13, '#74c0fc', 'right');
    text(v, bx, 448 + row * 20, 13, '#fff');
  });
  if (Math.floor(tick / 30) % 2) text('Нажми ENTER или ПРОБЕЛ', VW / 2, 518, 18, '#ffd43b', 'center');
  if (god) text('СУПЕРГЕРОЙ ВКЛЮЧЁН [4]', VW - 16, 20, 14, '#ffd43b', 'right', '#000');
}

function drawCard() {
  overlay(0.85);
  const d = level.def;
  text(d.boss ? 'ФИНАЛ' : `УРОВЕНЬ ${levelIdx + 1}`, VW / 2, 170, 26, '#74c0fc', 'center');
  text(d.name, VW / 2, 225, 44, '#ffd43b', 'center', '#000');
  text(d.tip, VW / 2, 290, 18, '#fff', 'center');
  if (!d.boss) text('Монеты = деньги · Булочки = здоровье · Флажки = контрольные точки', VW / 2, 325, 15, '#adb5bd', 'center');
  else text('Стреляй самолётиками или прыгай сверху. Он становится злее!', VW / 2, 325, 15, '#adb5bd', 'center');
  if (cardT > 20 && Math.floor(cardT / 30) % 2 === 0) text('ENTER — начать', VW / 2, 400, 20, '#fff', 'center');
}

function draw() {
  ctx.save();
  if (state === 'title') { drawTitle(); ctx.restore(); return; }
  if (state === 'win') {
    cam = 0;
    drawFacade(-30 + (cardT * 2.2) % (VW + 60));
    for (const q of parts) { ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.s, q.s * 1.6); }
    ctx.fillStyle = 'rgba(10,14,24,.75)'; rr(130, 14, 700, 92, 12);
    text('ТЫ СБЕЖАЛ ИЗ СКОЛКИ!', VW / 2, 42, 36, '#ffd43b', 'center');
    text(`Андрей Ильич отпустил тебя. Выходные — твои!  Счёт: ${score} · Деньги: ${money} ₽`, VW / 2, 76, 15, '#fff', 'center');
    if (cardT > 90 && Math.floor(cardT / 30) % 2) text('ENTER — в главное меню', VW / 2, 96, 13, '#69db7c', 'center');
    ctx.restore();
    return;
  }
  if (shake > 0) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  drawBG(level.def.theme, cam);
  drawTiles();
  drawWorldBits();
  for (const it of level.items) drawItem(it);
  for (const e of ents) if (e.t === 'boss') drawBoss(e); else if (Math.abs(e.x - cam - VW / 2) < VW) drawEnemy(e);
  drawPlayer();
  for (const q of projs) drawProj(q);
  for (const q of parts) { ctx.fillStyle = q.c; ctx.globalAlpha = Math.min(1, q.life / 20); ctx.fillRect(q.x - cam, q.y, q.s, q.s); }
  ctx.globalAlpha = 1;
  for (const t of texts) text(t.s, t.x - cam, t.y, 14, t.c, 'center', '#000');
  ctx.restore();
  if (ilyaFlash > 0) {
    ctx.fillStyle = `rgba(255,236,153,${ilyaFlash / 160})`; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2, VH / 2); ctx.rotate(tick * 0.01);
    ctx.fillStyle = `rgba(255,255,255,${ilyaFlash / 240})`;
    for (let k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(700, -40); ctx.lineTo(700, 40); ctx.fill(); }
    ctx.restore();
    if (ilyaFlash > 30) text('ИЛЬЯ К. РЕШИЛ ВСЕ ПРОБЛЕМЫ', VW / 2, VH / 2 - 60, 30, '#1c7ed6', 'center', '#fff');
  }
  drawHUD();
  if (state === 'card') drawCard();
  else if (state === 'pause') { overlay(0.6); text('ПАУЗА', VW / 2, VH / 2, 48, '#fff', 'center'); text('P / Esc — продолжить', VW / 2, VH / 2 + 50, 18, '#adb5bd', 'center'); }
  else if (state === 'clear') {
    overlay(0.75);
    text('УРОВЕНЬ ПРОЙДЕН!', VW / 2, 180, 44, '#69db7c', 'center', '#000');
    text(`Время: ${Math.floor(levelTime / 60)} с · Бонус за скорость: +${lastBonus}`, VW / 2, 250, 20, '#fff', 'center');
    text('Счёт: ' + score, VW / 2, 290, 24, '#ffd43b', 'center');
    if (cardT > 40) text('ENTER — дальше', VW / 2, 370, 20, '#fff', 'center');
  } else if (state === 'over') {
    overlay(0.8);
    text('ТЕБЯ ПОЙМАЛИ!', VW / 2, 190, 50, '#ff6b6b', 'center', '#000');
    text('Отправлен на дополнительное занятие...', VW / 2, 250, 20, '#fff', 'center');
    if (cardT > 40) text('ENTER — попробовать снова', VW / 2, 330, 20, '#ffd43b', 'center');
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// отладка: __skolka.jump(5) — сразу к боссу
window.__skolka = { jump(i) { levelIdx = i; loadLevel(i); state = 'play'; }, get s() { return { state, player, boss, levelIdx, ents }; } };
</script>
